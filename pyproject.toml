[build-system]
build-backend = "maturin"
requires = [ "maturin>=1.9,<2" ]

[project]
name = "arrow-lint"
description = "A fast, opinionated, extensible linter for Apache Arrow datasets and related formats."
readme = "README.md"
authors = [
  { name = "arrow-lint contributors" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = []
scripts.arrow-lint = "arrow_lint.cli:trigger"
scripts.arrowdiff = "arrow_lint.cli:trigger_diff"

[dependency-groups]
dev = [
  "coverage[toml]>=7.10.6",
  "duckdb>=1.5",
  "maturin>=1.9,<2",
  "poethepoet>=0.34",
  "polars>=1.43",
  "pyarrow>=25",
  "pytest>=8.3.5",
  "pytest-cov>=6.2.1",
]
docs = [
  "duckdb>=1.5",
  "myst-nb>=1.2",
  "polars>=1.43",
  "pyarrow>=25",
  "pydata-sphinx-theme>=0.16.1",
  "sphinx>=8.2.3",
]

[tool.maturin]
module-name = "arrow_lint._native"
python-source = "src"
manifest-path = "crates/arrowlint-python/Cargo.toml"
include = [
  { path = "LICENSE", format = "sdist" },
]
features = [ "pyo3/extension-module" ]

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
lint.select = [
  # flake8-builtins
  "A",
  # flake8-annotations
  "ANN",
  # flake8-comprehensions
  "C4",
  # mccabe
  "C90",
  # pycodestyle
  "E",
  # pyflakes
  "F",
  # isort
  "I",
  # pylint
  "PL",
  # ruff
  "RUF",
  # flake8-simplify
  "SIM",
  "W",
]
# Ignore `F401` (unused imports) for `__init__.py` file
lint.per-file-ignores."__init__.py" = [ "F401" ]
# Ignore `PLC0415` (import not at top-level) for `api.py`, which defers the
# native extension import so the pure-Python package stays importable.
lint.per-file-ignores."src/arrow_lint/api.py" = [ "PLC0415" ]

[tool.vulture]
paths = [ "src/arrow_lint", "tests" ]
min_confidence = 90

[tool.pytest]
ini_options.pythonpath = [ "." ]
ini_options.addopts = [
  "--cov=arrow_lint",
  "--cov-report=term-missing",
  "--cov-report=xml",
]

[tool.coverage]
run.source = [ "src/arrow_lint" ]
run.branch = true
report.skip_covered = true
report.show_missing = true

[tool.poe]
# tasks for development environments
tasks.develop.shell = """
maturin develop
"""
tasks.rust-test.shell = """
cargo test
"""
tasks.test.shell = """
maturin develop && pytest
"""
tasks.lint.shell = """
prek run --all-files
"""
tasks.pipeline.shell = """
cargo test && maturin develop && prek run --all-files && pytest
"""
