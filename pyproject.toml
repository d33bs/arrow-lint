[build-system]
build-backend = "maturin"
requires = [ "maturin>=1.9,<2" ]

[project]
name = "arrow-lint"
description = "A fast, opinionated, extensible linter for Apache Arrow datasets and related formats."
readme = "README.md"
authors = [
  { name = "ArrowLint contributors" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
]
scripts.arrow-lint = "arrow_lint.cli:trigger"

[dependency-groups]
dev = [
  "coverage[toml]>=7.15.2",
  "maturin>=1.9,<2",
  "poethepoet>=0.48.0",
  "pytest>=9.1.1",
  "pytest-cov>=6.2.1",
]
docs = [
  "myst-nb>=1.4.0",
  "pydata-sphinx-theme>=0.20.0",
  "sphinx>=9.0.4",
]

[tool.maturin]
manifest-path = "crates/arrowlint-python/Cargo.toml"
module-name = "arrow_lint._native"
python-source = "src"
features = [ "pyo3/extension-module" ]

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
lint.select = [
  # flake8-builtins
  "A",
  # flake8-annotations
  "ANN",
  # flake8-comprehensions
  "C4",
  # mccabe
  "C90",
  # pycodestyle
  "E",
  # pyflakes
  "F",
  # isort
  "I",
  # pylint
  "PL",
  # ruff
  "RUF",
  # flake8-simplify
  "SIM",
  "W",
]
# Ignore `F401` (unused imports) for `__init__.py` file
lint.per-file-ignores."__init__.py" = [ "F401" ]

[tool.pytest.ini_options]
pythonpath = [ "." ]
addopts = [
  "--cov=arrow_lint",
  "--cov-report=term-missing",
  "--cov-report=xml",
]

[tool.coverage.run]
branch = true
source = [ "src/arrow_lint" ]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.poe.tasks]
# tasks for development environments
develop.shell = """
maturin develop
"""
rust-test.shell = """
cargo test
"""
test.shell = """
maturin develop && pytest
"""
lint.shell = """
pre-commit run --all-files
"""
pipeline.shell = """
cargo test && maturin develop && pre-commit run --all-files && pytest
"""

[tool.vulture]
min_confidence = 90
paths = [ "src/arrow_lint", "tests" ]
