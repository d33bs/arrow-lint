---
# used for publishing packages to pypi on release
name: publish pypi release

on:
  release:
    types:
      - published

jobs:
  publish_pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch tags
        run: git fetch --all --tags
      - name: Python setup
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - name: Verify release tag matches package version
        if: ${{ github.event_name == 'release' }}
        run: |
          jq_filter='.packages[] | select(.name == "arrowlint-python")'
          package_version="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r "${jq_filter} | .version"
          )"
          release_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$release_version" ]; then
            message="Release tag ${GITHUB_REF_NAME} does not match"
            message="${message} package version ${package_version}."
            echo "::error::${message}"
            exit 1
          fi
      - name: uv build distribution content
        run: uv build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0
