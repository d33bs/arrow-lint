---
# used for publishing packages to pypi on release
name: publish pypi release

"on":
  release:
    types:
      - published

jobs:
  build_wheels:
    name: wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - windows-2022
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
      - name: Sync package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: >-
          python tools/sync_release_version.py
          "$RELEASE_TAG"
      - name: Build wheel
        run: >-
          uvx --python "${{ matrix.python-version }}"
          --from "maturin>=1.9,<2"
          maturin build --release --compatibility pypi
          --interpreter python --out dist
      - name: Verify wheel interpreter tag
        run: >-
          python tools/check_release_artifacts.py
          --expected-python "${{ matrix.python-version }}"
          dist
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build_sdist:
    name: source distribution
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch tags
        run: git fetch --all --tags
      - name: Python setup
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
      - name: Sync package version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python tools/sync_release_version.py
          "$RELEASE_TAG"
      - name: Build source distribution
        run: uvx --from "maturin>=1.9,<2" maturin sdist --out dist
      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish_pypi:
    name: publish to PyPI
    needs:
      - build_wheels
      - build_sdist
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      contents: read
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
      - name: Prepare package distributions
        run: |
          rm -rf dist
          python tools/prepare_release_dist.py \
            dist-artifacts \
            dist
      - name: Verify package distributions
        run: |
          uvx twine check dist/*
          python tools/check_release_artifacts.py dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
